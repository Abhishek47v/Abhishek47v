# The only automation in this repository, and it writes nothing.
#
# assets/*.svg are generated by scripts/build-svg.mjs and committed, because a
# profile README has to render for a stranger with no build step in between.
# Committed generated files drift the moment someone edits the output instead
# of the source, so this re-runs the generator and fails if the result differs.
#
# There is deliberately no schedule. Nothing here depends on time or on the
# GitHub API, so a cron job would only produce commits that change nothing.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node only for its standard library; the generator has no dependencies,
      # so the runner's preinstalled version is enough and there is nothing to
      # install, cache or resolve.
      - name: assets match their generator
        run: node scripts/build-svg.mjs --check

      - name: assets are well-formed XML
        run: |
          for f in assets/*.svg; do
            python3 -c "import sys,xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$f"
            echo "ok  $f"
          done
