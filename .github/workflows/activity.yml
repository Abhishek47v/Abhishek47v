# The only workflow here that writes anything.
#
# It renders README.md from README.md.tpl, filling the activity section from
# contributionsCollection. It is separate from verify.yml so that the gate
# workflow can stay `contents: read` — only this one needs write, and only for
# one file.
#
# The renderer emits nothing at all below its threshold, so on a quiet quarter
# this job commits nothing rather than publishing an empty box.

name: activity

on:
  schedule:
    - cron: "17 5 * * *"     # daily, off the hour so it is not in the 00:00 stampede
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false   # never interrupt a job that is mid-commit

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render README from the template
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/render-readme.mjs

      - name: Commit only if something changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh activity section"
          git push
