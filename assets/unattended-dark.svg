<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 11 667 151" width="667" height="151" role="img" aria-labelledby="t d"><title id="t">A request, and what happens after it</title><desc id="d">A request travels from the interface to the API to the queue. The interface and API dim once it has been answered, and the queue, worker and store carry on without them — the part that runs unattended — before a change is pushed back up to the interface over a realtime edge.</desc><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;-webkit-font-smoothing:antialiased}.rail{fill:none;stroke:#3B4757;stroke-width:1.25}.arc{fill:none;stroke:#3B4757;stroke-width:1.25;stroke-dasharray:2 4;opacity:.75}.pulse{fill:none;stroke:#D8AE72;stroke-width:2;stroke-linecap:round}.ring{fill:none;stroke:#B3C0CC;stroke-width:1.5}.core{fill:#D8AE72}.name{fill:#DDE5EC;font-size:12px;letter-spacing:.02em}.sub{fill:#A4B1BE;font-size:10px;letter-spacing:.02em}.edge-label{fill:#A4B1BE;font-size:10px;letter-spacing:.09em}.brace{fill:none;stroke:#D8AE72;stroke-width:1.25;opacity:.55}.brace-label{fill:#D8AE72;font-size:10.5px;letter-spacing:.12em}.node{opacity:0.22}.p1{animation:p1 8s linear infinite}.p2{animation:p2 8s linear infinite}.p3{animation:p3 8s linear infinite}.p4{animation:p4 8s linear infinite}.pr{animation:pr 8s linear infinite}.n1{animation:n1 8s ease-in-out infinite}.n2{animation:n2 8s ease-in-out infinite}.n3{animation:n3 8s ease-in-out infinite}.n4{animation:n4 8s ease-in-out infinite}.n5{animation:n5 8s ease-in-out infinite}.brace-group{opacity:0;animation:brace 8s ease-in-out infinite}@keyframes p1{0%,0%{stroke-dashoffset:30;opacity:0}0.5%{opacity:1}7.5%{opacity:1}8%,100%{stroke-dashoffset:-152;opacity:0}}@keyframes p2{0%,10%{stroke-dashoffset:30;opacity:0}10.5%{opacity:1}17.5%{opacity:1}18%,100%{stroke-dashoffset:-152;opacity:0}}@keyframes p3{0%,30%{stroke-dashoffset:30;opacity:0}30.5%{opacity:1}37.5%{opacity:1}38%,100%{stroke-dashoffset:-152;opacity:0}}@keyframes p4{0%,40%{stroke-dashoffset:30;opacity:0}40.5%{opacity:1}47.5%{opacity:1}48%,100%{stroke-dashoffset:-152;opacity:0}}@keyframes pr{0%,68%{stroke-dashoffset:30;opacity:0}68.5%{opacity:1}83.5%{opacity:1}84%,100%{stroke-dashoffset:-468.7;opacity:0}}@keyframes n1{0%{opacity:1}22%{opacity:1}28%{opacity:0.22}84%{opacity:0.22}90%{opacity:1}100%{opacity:1}}@keyframes n2{0%{opacity:0.22}7%{opacity:0.22}10%{opacity:1}22%{opacity:1}28%{opacity:0.22}100%{opacity:0.22}}@keyframes n3{0%{opacity:0.22}17%{opacity:0.22}20%{opacity:1}60%{opacity:1}66%{opacity:0.22}100%{opacity:0.22}}@keyframes n4{0%{opacity:0.22}37%{opacity:0.22}40%{opacity:1}84%{opacity:1}92%{opacity:0.22}100%{opacity:0.22}}@keyframes n5{0%{opacity:0.22}47%{opacity:0.22}50%{opacity:1}76%{opacity:1}84%{opacity:0.22}100%{opacity:0.22}}@keyframes brace{0%,30%{opacity:0}38%{opacity:1}76%{opacity:1}84%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}.node,.brace-group{animation:none;opacity:1}}</style><path class="rail" d="M72,82 H680"/><path class="arc" d="M528,74 C470,20 150,20 72,74"/><path class="pulse pr" d="M528,74 C470,20 150,20 72,74" stroke-dasharray="30 468.7"/><text class="edge-label" x="307" y="26" text-anchor="middle">realtime</text><path class="pulse p1" d="M72,82 H224" stroke-dasharray="30 152"/><path class="pulse p2" d="M224,82 H376" stroke-dasharray="30 152"/><path class="pulse p3" d="M376,82 H528" stroke-dasharray="30 152"/><path class="pulse p4" d="M528,82 H680" stroke-dasharray="30 152"/><g class="node n1"><circle class="ring" cx="72" cy="82" r="5"/><circle class="core" cx="72" cy="82" r="2.25"/><text class="name" x="72" y="106" text-anchor="middle">interface</text><text class="sub" x="72" y="121" text-anchor="middle">React · TS</text></g><g class="node n2"><circle class="ring" cx="224" cy="82" r="5"/><circle class="core" cx="224" cy="82" r="2.25"/><text class="name" x="224" y="106" text-anchor="middle">api</text><text class="sub" x=